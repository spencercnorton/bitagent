# BitAgent headless backend and PostgreSQL for a single host.
# Copy .env.example to .env.public, set POSTGRES_PASSWORD, then run:
# docker compose -f examples/docker-compose.public.yml --env-file examples/.env.public up -d --build
# The HTTP API has no browser UI. Add authentication at your trusted proxy
# before exposing GraphQL, metrics or imports outside your trusted network.

services:

  bitagent:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: bitagent
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - worker
      - run
      - --all
    environment:
      # --- Database ---
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_NAME: bitmagnet
      POSTGRES_USER: bitmagnet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.public}

      # --- Crawler tunables ---
      # ScalingFactor multiplies internal worker counts. 1 is the
      # safe default for a small host; 4-10 on a beefier box.
      #
      # NOTE ON ENV KEY NAMING: keys carry NO `BITMAGNET_` prefix. Each key
      # is the config section name plus the Go struct field names, snake_cased
      # and uppercased (internal/config/config.go). A prefixed key matches no
      # config path — that is not an error, it is silently ignored and the
      # field keeps its default.
      DHT_CRAWLER_SCALING_FACTOR: "${DHT_SCALING_FACTOR:-1}"

      # --- TMDB (optional content-classifier input) ---
      # Free key from https://www.themoviedb.org/settings/api. Empty
      # disables the TMDB stage; bitagent works without it.
      TMDB_API_KEY: ${TMDB_API_KEY:-}

      # --- Torznab API key (REQUIRED if you expose /torznab publicly) ---
      # If left empty, /torznab is unauthenticated — fine on a tailnet
      # or behind a reverse-proxy with its own auth, but not on the
      # open internet.
      TORZNAB_API_KEY: ${TORZNAB_API_KEY:-}

      # --- CSAM blocklist (pre-fetch defense) ---
      # Enabled by default with no feeds = NoOp until you opt in.
      # Self-export to a local JSONL log is on by default; outbound
      # POST is off until you point it at a community endpoint.
      # See docs/csam-defense.md for full details.
      CSAM_BLOCKLIST_ENABLED: "${CSAM_BLOCKLIST_ENABLED:-true}"
      CSAM_BLOCKLIST_FEED_URLS: "${CSAM_BLOCKLIST_FEED_URLS:-}"
      CSAM_BLOCKLIST_EXPORT_ENABLED: "${CSAM_BLOCKLIST_EXPORT_ENABLED:-true}"
      CSAM_BLOCKLIST_EXPORT_UPSTREAM_URL: "${CSAM_BLOCKLIST_EXPORT_UPSTREAM_URL:-}"

      # --- Content filter (English-only / NSFW / format curation) ---
      # OFF by default. Observe deterministic and model decisions separately
      # and independently qualify model accuracy before enforcement.
      CONTENT_FILTER_ENABLED: "${CONTENT_FILTER_ENABLED:-false}"
      CONTENT_FILTER_ENFORCE: "${CONTENT_FILTER_ENFORCE:-false}"
      CONTENT_FILTER_LLM_ENABLED: "${CONTENT_FILTER_LLM_ENABLED:-false}"
      CONTENT_FILTER_LLM_ENFORCE: "${CONTENT_FILTER_LLM_ENFORCE:-false}"
      CONTENT_FILTER_LLM_ACTION: "${CONTENT_FILTER_LLM_ACTION:-drop}"

      # --- Retention (deletion of stale torrents) ---
      # OFF by default. Flip RETENTION_ENABLED first; let
      # bitagent_retention_would_purge_total stabilise; then flip
      # RETENTION_ENABLE_PURGE to actually delete.
      RETENTION_ENABLED: "${RETENTION_ENABLED:-false}"
      RETENTION_ENABLE_PURGE: "${RETENTION_ENABLE_PURGE:-false}"

      LOG_LEVEL: ${LOG_LEVEL:-info}

    ports:
      # Single host port serves GraphQL, /metrics, /torznab,
      # /evidence/arr/*, /import. Put a reverse proxy in front before
      # exposing to the open internet.
      - "${BITAGENT_HTTP_PORT:-3333}:3333"
      # BitTorrent peer port. Outbound-dominant; if you can't open
      # this in your firewall, the crawler still works (the DHT and
      # peer-find paths are outbound), throughput is just lower.
      - "${BITAGENT_PEER_PORT:-3334}:3334/tcp"
      - "${BITAGENT_PEER_PORT:-3334}:3334/udp"
    volumes:
      - bitagent-config:/root/.config/bitmagnet
      - bitagent-data:/root/.local/share/bitmagnet
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "http://127.0.0.1:3333/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: bitagent-postgres
    restart: unless-stopped
    shm_size: 512m
    environment:
      POSTGRES_DB: bitmagnet
      POSTGRES_USER: bitmagnet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.public}
      PGUSER: bitmagnet
    volumes:
      - bitagent-postgres:/var/lib/postgresql/data
    # Modest tuning suitable for a 4-8 GB host. Larger deployments
    # should bump shared_buffers and effective_cache_size to ~25% /
    # ~75% of available RAM respectively.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=100
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.02
      - -c
      - autovacuum_naptime=30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitmagnet -d bitmagnet"]
      interval: 10s
      start_period: 20s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  bitagent-config:
  bitagent-data:
  bitagent-postgres:
