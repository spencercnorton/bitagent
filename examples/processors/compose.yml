# Synthetic conformance services, separate from the core image and its database.
# Start/replace these at any time, then register their reachable endpoints.
services:
  reference:
    build:
      context: ../..
      dockerfile: examples/processors/reference.Dockerfile
    environment:
      PROCESSOR_LISTEN: 0.0.0.0:8090
    ports: ["127.0.0.1:8090:8090"]
    cpus: 0.5
    mem_limit: 64m
    pids_limit: 32
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  independent:
    image: python:3.13-alpine
    user: "65532:65532"
    entrypoint: [python3, /service.py]
    volumes: ["./independent/service.py:/service.py:ro"]
    environment:
      PROCESSOR_HOST: 0.0.0.0
    ports: ["127.0.0.1:8091:8091"]
    cpus: 0.5
    mem_limit: 64m
    pids_limit: 32
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
