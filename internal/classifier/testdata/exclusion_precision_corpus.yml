# Labelled corpus for the deterministic exclusion classifiers.
#
# Every case is run through the REAL core workflow by
# internal/classifier/exclusion_precision_test.go under the live production
# flags (delete_xxx=true, delete_content_types=music,ebook,audiobook,comic,
# game,software,course).
#
#   expect: keep    -> the workflow must NOT return ErrDeleteTorrent.
#                      A violation fails the build. There is no acceptable
#                      count above zero: the delete drops the torrents row and
#                      adds the infohash to the blocking bloom filter, which has
#                      no removal operation.
#   expect: delete  -> the workflow should return ErrDeleteTorrent.
#                      Misses are reported and gated by recallFloor, not by
#                      zero: a missed adult or course release falls through to
#                      the LLM/quarantine path, which is recoverable.
#
#   type            -> what the content actually is. Used only to group the
#                      reported precision/recall table.
#   files           -> "path|sizeMB". The extension rules are size-weighted, so
#                      realistic sizes matter.
#
# WHEN A WRONG CALL IS FOUND IN PRODUCTION, ADD IT HERE. That is the whole
# feedback loop — the row is what stops the same call being made twice.

