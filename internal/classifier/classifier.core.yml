    - rune
    - skidrow
    - wii
    - xbox
    - solidworks
    - ubuntu
    - visual ?studio
    - vmware
    - windows
  banned:
    - pa?edo(fil*|phil*)?
    - preteen
    - pthc
    - ptsc
    - lsbar
    - lsm
    - underage
    - hebefilia
