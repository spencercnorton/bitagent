  # `iso` lives here rather than in `software` because it is also a video
  # extension — a disc image is only software when the name says so.
  disc_image:
    - bin
    - iso
  video:
    - mp4
    - mkv
    - avi
    - iso
    - mov
    - wmv
    - flv
    - m4v
    - mpg
    - mpeg
    - ts
