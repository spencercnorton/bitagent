    - portable
    # game repack / scene groups and console tags: a bare .iso or .bin that is a
    # game is still software-shaped, and these markers never occur in a film title.
    - codex
    - dodi
    - empress
    - fitgirl
    - gamecube
    - gog
    - nintendo
    - playstation
    - ps#
    - psp
    - razor1911
