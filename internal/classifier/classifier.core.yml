$schema: "https://bitmagnet.io/schemas/classifier-0.1.json"
workflows:
  default:
    # delete torrents containing banned keywords:
    - if_else:
        condition: "([torrent.baseName] + torrent.files.map(f, f.basePath)).join(' ').matches(keywords.banned)"
        if_action: delete
    # try to identify content type for torrents without a hinted content type:
    - if_else:
        condition: "result.contentType == contentType.unknown"
        if_action:
          find_match:
            # match instructional / course content FIRST (owner decision D2).
            # Course material ships as video, audio OR pdf, so any later rule
            # claims it and mistypes it: The Great Courses MP3 sets were typing
            # `music`, MIT OCW lecture notes `ebook`, chaptered lecture m4b sets
            # `audiobook`. Typing it here is also what makes it excludable at all.
            - if_else:
                condition:
                  or:
                    - "torrent.baseName.matches(keywords.course_exact)"
                    - and:
                        - "torrent.baseName.matches(keywords.course_brand)"
                        - "torrent.baseName.matches(keywords.course_evidence)"
                if_action:
                  set_content_type: course
                else_action: unmatched
            # match audiobooks:
            # The `.m4b` clause used to type on the extension alone, with no
            # keyword gate at all — every chaptered m4b became an audiobook, so
            # podcasts, DJ mixes, live concerts and film scores were deleted.
            # It is now a corroborating signal, not a sufficient one.
            - if_else:
                condition:
                  and:
                    - "torrent.files.map(f, f.extension in extensions.audio ? f.size : - f.size).sum() > 50*mb"
                    - or:
                        - "torrent.baseName.matches(keywords.audiobook_strong)"
                        - "keywordList.audiobook_weak.filter(k, torrent.baseName.matches(k)).size() >= 2"
                        - and:
                            - "torrent.files.filter(f, f.extension in extensions.audiobook).size() > 0"
                            - "keywordList.audiobook_weak.filter(k, torrent.baseName.matches(k)).size() >= 1"
                if_action:
                  set_content_type: audiobook
                else_action: unmatched
            # match comics:
            - if_else:
                condition:
                  and:
                    - "torrent.files.map(f, f.extension in extensions.comic ? f.size : - f.size).sum() > 0"
                    - "!torrent.baseName.matches(keywords.document_archive)"
                if_action:
                  set_content_type: comic
                else_action: unmatched
            # match ebooks:
            # The extension list includes pdf/doc/docx/chm/rtf/odt, so without a
            # guard every document archive is an "ebook": court records, service
            # manuals, standards, technical reports, newspaper scans.
            - if_else:
                condition:
                  and:
                    - "torrent.files.map(f, f.extension in extensions.ebook ? f.size : - f.size).sum() > 0"
                    - "!torrent.baseName.matches(keywords.document_archive)"
                if_action:
                  set_content_type: ebook
                else_action: unmatched
            # match music:
            # The lossless arm is name-blind, so it claimed every audio-only
            # non-music release — dub tracks, commentary, sound-effect libraries,
            # drama CDs. The keyword arm is tiered because ep/lp/pop/rock/house
            # are ordinary words (NPR "Pop Culture Happy Hour", BBC Radio 4
            # "Bleak House", "Old Time Radio ... Ep.001-100" all typed music).
            - if_else:
                condition:
                  and:
                    - "!torrent.baseName.matches(keywords.not_music)"
                    - or:
                        - "torrent.files.map(f, f.extension in extensions.music ? f.size : - f.size).sum() > 0"
                        - and:
                            - or:
                                - "torrent.baseName.matches(keywords.music_strong)"
                                - "keywordList.music_weak.filter(k, torrent.baseName.matches(k)).size() >= 2"
                            - "torrent.files.map(f, f.extension in extensions.audio ? f.size : - f.size).sum() > 0"
                if_action:
                  set_content_type: music
                else_action: unmatched
            # match software:
            # `iso` and `bin` are deliberately NOT in extensions.software: both are
            # also disc-image extensions for video, so a DVD/BluRay .iso rip and a
            # VCD/SVCD .bin rip typed software and — with software in
            # delete_content_types — were deleted. set_content_type is terminal
            # (ContentAttributes.Merge only fills an unset type), so a movie typed
            # software here can never be re-typed by parse_video_content.
            - if_else:
                condition:
                  or:
                    - "torrent.files.map(f, f.extension in extensions.software ? f.size : - f.size).sum() > 0"
                    - and:
                        - "torrent.files.map(f, f.extension in extensions.disc_image ? f.size : - f.size).sum() > 0"
                        - "torrent.baseName.matches(keywords.software)"
                if_action:
                  set_content_type: software
                else_action: unmatched
            # match xxx:
            # Tiered: an `xxx_strong` keyword types on its own; `xxx_weak` keywords
            # are ordinary words that occur in catalogued titles AND in real episode
            # titles, and so require TWO DISTINCT weak hits.
            #
            # The weak count reads torrent.baseName ONLY; strong keywords still read
            # the file paths too. Counting weak hits over the union of every file
            # path is what makes "2 of N" trivial for a legitimate pack: a 94-file
            # Sex and the City set gets `sex*` free on every filename and needs one
            # more from 94 episode titles ("Cock a Doodle Do!" supplies it). South
            # Park supplies three ("Ass Burgers", "Cock Magic", "Sexual Healing").
            # The same union also handed out a free `ass` to every release shipping
            # Advanced SubStation `.ass` subtitles — most fansubbed anime.
            - if_else:
                condition:
                  and:
                    - "torrent.files.map(f, (f.extension in extensions.video || f.extension in extensions.image) ? f.size : - f.size).sum() > 0"
                    - or:
                        - "([torrent.baseName] + torrent.files.map(f, f.basePath)).join(' ').matches(keywords.xxx_strong)"
                        - "keywordList.xxx_weak.filter(k, torrent.baseName.matches(k)).size() >= 2"
                if_action:
                  set_content_type: xxx
                else_action: unmatched
    # if the name contains a full date, attach it to the result as it's a good indicator of content type:
    - find_match:
        - parse_date
    # if we know a content ID that isn't already attached, try to attach it, either from the local `content` table or an API integration:
    - if_else:
        condition:
          and:
            - "torrent.hasHintedContentId && !result.hasAttachedContent"
            # we might as well save work by restricting this to content types that have an API integration:
            - "result.contentType in [contentType.movie, contentType.tv_show, contentType.xxx]"
        if_action:
          find_match:
            - attach_local_content_by_id
            - if_else:
                condition: "flags.apis_enabled && flags.tmdb_enabled"
                if_action: attach_tmdb_content_by_id
                else_action: unmatched
    # parse video-related attributes for video torrents (including the base title, needed for the next step):
    - if_else:
        condition:
          or:
            - "result.contentType in [contentType.movie, contentType.tv_show]"
            - "torrent.files.map(f, f.extension in extensions.video ? f.size : - f.size).sum() > 100*mb"
        if_action:
          find_match:
            # parse video-related attributes from the torrent name;
            # if the content type wasn't previously specified and the name format doesn't suggest a movie or TV show, a "no match" will be returned:
            - parse_video_content
    # if content isn't already attached, and a base title has been parsed, then search for the content, either from the local `content` table or an API integration:
    - if_else:
        condition: "!result.hasAttachedContent && result.hasBaseTitle"
        if_action:
          find_match:
            - if_else:
                condition: "flags.local_search_enabled"
                if_action: attach_local_content_by_search
                else_action: unmatched
            - if_else:
                condition: "flags.apis_enabled && flags.tmdb_enabled"
                if_action: attach_tmdb_content_by_search
                else_action: unmatched
    # LLM fallback matcher: for movie/tv torrents that deterministic search
    # could not attach to a TMDB id (the release name is too messy — alt/foreign
    # titles, junk prefixes). Two-stage extract+rerank. Gated OFF by default via
    # flags.llm_match_enabled; the action itself is a further no-op unless the
    # classifier_llm_match config enables it (shadow) and enable_live (attach).
    - if_else:
        condition:
          and:
            - "!result.hasAttachedContent && result.hasBaseTitle"
            - "flags.llm_match_enabled"
            - "flags.apis_enabled && flags.tmdb_enabled"
            - "result.contentType in [contentType.movie, contentType.tv_show]"
        if_action:
          find_match:
            - attach_tmdb_content_by_llm_search
            - unmatched
    # delete specific content types based on the configured flags:
    - if_else:
        condition:
          or:
            - "result.contentType in flags.delete_content_types"
            - "flags.delete_xxx && result.contentType == contentType.xxx"
        if_action: delete
