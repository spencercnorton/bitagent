keywords:
  # ---- audiobook ----------------------------------------------------------
  # Strong: an explicit audiobook marker. Weak: words equally at home in an
  # album title — Bob Dylan "Biograph", Iron Maiden "The Book Of Souls", the
  # band "The Books", "The Jungle Book" OST — so one hit is not evidence.
  audiobook_strong:
    - audiobooks?
    - audiolibro*
    - (un)?abridged
    - hoerbuch
    # audiobook publisher imprints
    - audible
    - blackstone ?audio
    - brilliance ?audio
    - podium ?audio
    - recorded ?books
    - tantor ?(audio|media)
  # `narrated ?by` is weak, not strong: it is equally a classical-recording
  # credit (Prokofiev, "Peter and the Wolf", narrated by David Bowie).
  audiobook_weak:
    - "*biograph*"
    - books?
    - chapters?
    - narrated ?by
    - novels?
    - read ?by
  # ---- music --------------------------------------------------------------
  music_strong:
    - album
    - compilation
    - discography
    - music
    - \V.?\A.?
    - various artists
    - vinyl
  # Ordinary words. NPR "Pop Culture Happy Hour", BBC Radio 4 "Bleak House"
  # and "Old Time Radio ... Ep.001-100" were all typed music on one of these.
  music_weak:
    - classical
    - disco
    - ep
    - folk
    - hits
    - house
    - indie
    - jazz
    - lp
    - metal
    - pop
    - bootleg
    - mixtape
    - reggae
    - remix*
    - rock
    - sessions?
    - single
    - trance
  # Guard for the lossless arm, which is otherwise name-blind and claimed every
  # audio-only release that is not music.
  not_music:
    - audio ?only
    - audio ?tracks?
    - commentary
    - drama ?cd
    - dub(bed|s)?
    - lectures?
    - podcasts?
    - radio ?drama
    - sound ?effects?
    - sync ?pack
    - track ?pack
    - 480p
    - 720p
    - 1080p
    - 2160p
    - bdrip
    - bluray
    - brrip
    - dvdrip
    - hdtv
    - webrip
    - xvid
  # ---- ebook / comic ------------------------------------------------------
  # Both rules are pure extension-dominance with no keyword at all, so without
  # this guard every pdf/cbz payload is a book: court records, service manuals,
  # standards, arXiv dumps, newspaper scans, screenplays.
  document_archive:
    - arxiv
    - catalogs?
    - catalogues?
    - core ?rules
    - court
    - datasheets?
    - declassified
    - dockets?
    - documentation
    - dumps?
    - field ?manuals?
    - handbooks?
    - ieee
    - imslp
    - litigation
    - manuals?
    - nasa
    - newspapers?
    - pubmed
    - records
    - reports?
    - rfc
    - schematics?
    - scores?
    - screenplays?
    - service ?manuals?
    - specifications?
    - standards?
    - transcripts?
    - unsealed
    - wiring
  # ---- xxx ----------------------------------------------------------------
  # Decisive alone. Every entry must be a word that appears in neither a
  # catalogued title nor an episode title — the match runs over file paths too.
  # Deliberately NOT here, each for a named collision:
  #   *xxx*   WWE WrestleMania XXX, Super Bowl XXX (Roman numeral)
  #   *porn*  After Porn Ends (2012)
  #   anal    South Park S01E01 "Cartman Gets an Anal Probe"
  #   boob*   Friends S01E13 "The One With the Boobies"
  #   orgy / erotic* / orgasm* / slut*   all occur in episode titles
  xxx_strong:
    - blowjobs?
    - bukkake
    - creampie*
    - cumshots?
    - deepthroat*
    - gangbang*
    - "*gloryhole*"
    - handjobs?
    - nubile*
    - private ?gold
    - siterip
    - "*wank*"
    # studio / site names. Written with ` ?` (any optional non-word char) because
    # releases use both `NaughtyAmerica` and `Naughty.America`; a concatenated
    # literal silently matches only half of them.
    # Deliberately excluded as too collision-prone with real titles:
    #   blacked (ordinary past-tense verb), vixen (Vixen, 2015 CW Seed series;
    #   Russ Meyer's Vixen!, 1968), babes (Babes, 2024), wicked (Wicked, 2024),
    #   private, deeper, tushy, evil angel (Evil Angel, 2009 horror film).
    - bang ?bros
    - bang ?bus
    - brazzers
    - cum ?louder
    - digital ?playground
    - fake ?hub
    - jules ?jordan
    - legal ?porno
    - met ?art
    - mofos
    - naughty ?america
    - nubile ?films
    - reality ?kings
    - sex ?art
    - team ?skeet
    - twistys
    # JAV / regional studio codes: no English keyword ever appears in these
    # release names, so they are invisible to both tiers without an explicit list.
    - caribbeancom
    - fc# ?ppv
    - heyzo
    - 1pondo
    - paco ?paco ?mama
    - tokyo ?hot
  # Two DISTINCT hits required, and both must be in torrent.baseName. Each of
  # these is in a real catalogued title:
  #   ass       Kick-Ass, Bad Ass, Big Ass Spider, and every `.ass` subtitle file
  #   cum*      Magna Cum Laude, every Benedict Cumberbatch release
  #   dicks?    Moby Dick, Dick Tracy, Dick Johnson Is Dead, The Dick Van Dyke Show
  #   cocks?    A Cock and Bull Story
  #   hardcore  Hardcore Henry, Hardcore (1979), Hardcore Pawn
  #   kink*     Kinky Boots
  #   sex*      Sexy Beast, Sex and the City, Sex Education, Sex Lies and Videotape
  #   pussy     Pussy Riot: A Punk Prayer
  #   pov       POV (PBS documentary strand, running since 1988)
  #   threesome Threesome (1994), Threesome (2011)
  #   *xxx*     WrestleMania XXX, Super Bowl XXX, xXx (2002), MAXXX, xxxHOLiC
  #   *porn*    After Porn Ends, Zack and Miri Make a Porno, Money Shot
  #   milf*     MILF (2018)
  #   onlyfans  OnlyFans: Selling Sexy (2021)
  #   slut*     "slut" is Swedish/Danish/Norwegian for "end"
  #   orgy      Orgy of the Dead (1965)
  #   boob*     Star Trek TNG "Booby Trap"; Friends "The One With the Boobies"
  # The second half of this list is adult-context vocabulary: individually weak
  # (Teen Wolf, Blonde, The Naked Gun, Babes) but decisive in pairs.
  xxx_weak:
    - amateur
    - anal
    - ass
    - bdsm
    - blondes?
    - bondage
    - boob*
    - busty
    - camgirl
    - cocks?
    - compilation
    - cougars?
    - cum*
    - dicks?
    - doujin
    - ecchi
    - erotic*
    - fetish
    - "*fuck*"
    - gonzo
    - hardcore
    - hentai
    - jav
    - kink*
    - latina
    - milf*
    - naked
    - nude*
    - onlyfans
    - orgasm*
    - orgy
    - "*porn*"
    - pov
    - pussy
    - seduc*
    - sex*
    - slut*
    - striptease
    - teens?
    - threesome
    - tits?
    - uncensored
    - webcam
    - "*xxx*"
  # ---- course (owner decision D2) -----------------------------------------
  # A platform/publisher/certification name is not destructive evidence on its
  # own. IMDb's title corpus contains ordinary episodes named Skillshare,
  # Udemy, Udacity and Wondrium plus documentary/news titles mentioning Khan
  # Academy, Lynda.com and Pluralsight. Require a second, explicit product
  # signal from the BASE NAME; file-path extras never classify the whole set.
  course_brand:
    - acloudguru
    - cbtnuggets
    - codecademy
    - codewithmosh
    - datacamp
    - digitaltutors
    - frontend ?masters
    - great ?courses
    - groove3
    - inner ?circle ?trader
    - infinite ?skills
    - itpro ?tv
    - khan ?academy
    - kodekloud
    - laracasts
    - linkedin ?learning
    - linuxacademy
    - lynda ?com
    - mit ?ocw
    - open ?yale
    - pentesteracademy
    - pluralsight
    - proko
    - skillshare
    - teamtreehouse
    - testout
    - ttc ?video
    - tutsplus
    - udacity
    - udemy
    - wondrium
    - zerotomastery
    # certification tracks
    - ccna
    - ccnp
    - cissp
    - comptia
    - pimsleur
  course_evidence:
    - bootcamps?
    - certified
    - complete ?class
    - complete ?courses?
    - course ?overview
    - essential ?training
    - full ?certification
    - fundamentals
    - lessons? ##
    - levels? #
    - mastering
    - mentorship
  # Generic instructional words must never manufacture delete authority by
  # co-occurring. These are bounded, reviewed product identities with no
  # catalogued non-course collision in the IMDb title census; unlike the old
  # generic pair rules, neither ordering nor arbitrary word spans are accepted.
  course_exact:
    - beachbody p##x
    - crashcourse world ?history
    - coursera machine ?learning
    - frontend ?masters complete ?intro
    - groove3 ableton ?live ?## explained
    - learn ?python from ?scratch
    - mit ?ocw
    - open ?yale ?courses
    - packt mastering
    - pluralsight docker ?deep ?dive
    - rocket ?spanish level ?# complete ?audio ?course
    - rosetta ?stone totale
    - the ?great ?courses books ?that ?have ?made ?history
    - the ?great ?courses elements ?of ?jazz
    - the ?great ?courses the ?english ?novel
    - the ?great ?courses the ?history ?of ?ancient ?rome
    - the ?great ?courses the ?symphony
    - the ?great ?courses understanding ?the ?universe
    - ttc great ?masters
    - yoga ?with ?adriene
  # ---- software -----------------------------------------------------------
  # Corroboration for a bare disc image (see extensions.disc_image).
  software:
    - activator
    - adobe
    - arch ?linux
    - autocad
    - autodesk
    - centos
    - crack(ed|s)?
