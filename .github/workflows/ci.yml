# go vet + the unit suite, and the ui/ suite (hash-locked deps, ruff, pytest
# with warnings as errors, shipped-script syntax) on every pull request and on
# main. Tests that need Postgres skip when it is absent; the maintainer's
# pipeline runs the race and integration suites. No secrets, read-only token,
# GitHub-owned actions pinned.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 ./...
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -q --require-hashes -r requirements.lock -r requirements-test.lock
      - run: python -m pip install -q --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m pip install -q ruff==0.8.6
      - run: ruff check .
      - run: python -m pytest -q -W error -p no:cacheprovider
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: for f in static/js/*.js; do node --check "$f"; done
      - run: node --test tests/library_state.test.js
