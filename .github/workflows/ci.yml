# Public Go race tests, PostgreSQL integration, operator UI checks and image build.
# Read-only tokens, disposable databases and commit-pinned GitHub actions.
name: CI
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 -timeout=10m ./...
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -q --require-hashes -r requirements.lock -r requirements-test.lock
      - run: python -m pip install -q --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m pip install -q ruff==0.8.6
      - run: ruff check .
      - run: python -m pytest -q -W error -p no:cacheprovider
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: for f in static/js/*.js; do node --check "$f"; done
      - run: node --test tests/library_state.test.js

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: bitagent_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      BITAGENT_TEST_POSTGRES_DSN: postgres://postgres:test-only@127.0.0.1:5432/bitagent_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: go test -race -p 1 -count=1 -timeout=15m ./internal/junkpurge ./internal/classifier/llmmatch ./internal/classifier/llmstage ./internal/llmcapture
  image:
    name: Public container build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build supported container with source identity
        env:
          BUILD_SOURCE: https://github.com/${{ github.repository }}
        run: |
          VERSION="v$(sed -n 's/^__version__ = "\([^"]*\)"/\1/p' ui/version.py)"
          COMMIT=$(git rev-parse HEAD)
          BUILD_DATE=$(git show -s --format=%cI HEAD)
          docker build --platform linux/amd64 --build-arg VERSION="$VERSION" \
            --build-arg COMMIT="$COMMIT" --build-arg BUILD_DATE="$BUILD_DATE" \
            --build-arg SOURCE="$BUILD_SOURCE" --tag bitagent:ci .
          test "$(docker image inspect bitagent:ci --format '{{.Os}}/{{.Architecture}}')" = 'linux/amd64'
          test "$(docker image inspect bitagent:ci --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$VERSION"
          test "$(docker image inspect bitagent:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$COMMIT"
          test "$(docker image inspect bitagent:ci --format '{{index .Config.Labels "org.opencontainers.image.created"}}')" = "$BUILD_DATE"
          test "$(docker image inspect bitagent:ci --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = "$BUILD_SOURCE"
          docker run --rm --network none --read-only --tmpfs /data:uid=10001,gid=10001 \
            --user 10001:10001 --entrypoint python3 --workdir /app/ui \
            --env EXPECTED_VERSION="${VERSION#v}" bitagent:ci \
            -c 'import os; import app, account_usage, discovery; from version import __version__; assert __version__ == os.environ["EXPECTED_VERSION"]'
