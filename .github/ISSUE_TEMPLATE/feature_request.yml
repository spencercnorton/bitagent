name: Feature request
description: Propose a change to how BitAgent works. Read the out-of-scope list in CONTRIBUTING.md first.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that BitAgent makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Which surface (crawler, classifier, evidence, Torznab, GraphQL, dashboard)?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
