---
id: bitagent-private
name: BitAgent Private Library
description: "BitAgent private member media library"
language: en-US
type: private
encoding: UTF-8
links:
  - https://bitagent.example.org/
caps:
  categorymappings:
    - {id: 2000, cat: Movies, desc: "Movies"}
    - {id: 3000, cat: Audio, desc: "Music"}
    - {id: 5000, cat: TV, desc: "TV"}
    - {id: 8000, cat: Other, desc: "Other"}
  modes:
    search: [q]
    movie-search: [q, imdbid, tmdbid]
    # Cardigann calls this mode music-search; wire caps use audio-search.
    music-search: [q]
    tv-search: [q, imdbid, tmdbid, tvdbid, season, ep]
settings:
  - name: apikey
    type: password
    label: API Key
  - name: info
    type: info
    label: Member access
    default: "Sign in to your BitAgent instance and create your own API key. Use the instance's base URL. Membership must be active."
search:
  paths:
    - path: torznab/private/api
      response:
        type: xml
  inputs:
    apikey: "{{ .Config.apikey }}"
    t: "{{ .Query.Type }}"
    q: "{{ .Keywords }}"
    cat: "{{ join .Categories \",\" }}"
    imdbid: "{{ .Query.IMDBIDShort }}"
    tmdbid: "{{ .Query.TMDBID }}"
    tvdbid: "{{ .Query.TVDBID }}"
    season: "{{ .Query.Season }}"
    ep: "{{ .Query.Ep }}"
    limit: 100
  error:
    - selector: error
      message:
        selector: error
        attribute: description
  rows:
    selector: rss > channel > item
  fields:
    category:
      selector: "[name=category]"
      attribute: value
    title:
      selector: title
    details:
      text: /library
    date:
      selector: pubDate
    size:
      selector: "[name=size]"
      attribute: value
    download:
      selector: enclosure
      attribute: url
    seeders:
      selector: "[name=seeders]"
      attribute: value
      optional: true
    leechers:
      selector: "[name=leechers]"
      attribute: value
      optional: true
# Private downloads must use the site's personalized .torrent URL. Do not
# replace download with infohash: Cardigann may synthesize a public magnet.
